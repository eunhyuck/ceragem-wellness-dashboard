    let selectedPersona = 'all';

    // Populate category dropdown
    const catSelect = document.getElementById('category-filter');
    const categories = Array.from(new Set(rawData.map(d => d.category))).sort();
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      catSelect.appendChild(opt);
    });

    function setPersona(persona) {
      selectedPersona = persona;
      document.querySelectorAll('.persona-tab').forEach(tab => {
        if (tab.dataset.persona === persona) {
          tab.classList.remove('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
          tab.classList.add('bg-slate-900', 'text-white');
        } else {
          tab.classList.remove('bg-slate-900', 'text-white');
          tab.classList.add('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
        }
      });
      renderCards();
    }

    function getPersonaBadge(p) {
      if (p.includes('1')) return '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-blue-100 text-blue-800">P1 롱제비티</span>';
      if (p.includes('2')) return '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-100 text-emerald-800">P2 리커버리</span>';
      if (p.includes('3')) return '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-purple-100 text-purple-800">P3 세컨홈러</span>';
      if (p.includes('4')) return '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-amber-100 text-amber-800">P4 취미부자</span>';
      if (p.includes('5')) return '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-rose-100 text-rose-800">P5 뷰티케어</span>';
      return '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-slate-100 text-slate-800">기타</span>';
    }

    function renderCards() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
      const catTerm = document.getElementById('category-filter').value;
      const container = document.getElementById('cards-container');

      const filtered = rawData.filter(d => {
        const matchPersona = (selectedPersona === 'all') || (d.persona === selectedPersona);
        const matchCategory = (catTerm === 'all') || (d.category === catTerm);
        const matchSearch = !searchTerm || 
          d.title.toLowerCase().includes(searchTerm) || 
          d.snippet.toLowerCase().includes(searchTerm) || 
          d.reply_preview.toLowerCase().includes(searchTerm) ||
          d.query.toLowerCase().includes(searchTerm) ||
          d.category.toLowerCase().includes(searchTerm);
        return matchPersona && matchCategory && matchSearch;
      });

      document.getElementById('filtered-count').textContent = filtered.length;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-2 py-16 text-center text-slate-400 bg-white rounded-xl border border-slate-200">
            <i class="fa-solid fa-inbox text-4xl mb-3 text-slate-300"></i>
            <p class="text-sm">조건에 맞는 순수 거주자 고충 글이 없습니다.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(d => {
        const hasRealReply = d.reply_preview && !d.reply_preview.includes('(댓글 소통');
        return `
          <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 hover:shadow-md transition-shadow flex flex-col justify-between">
            <div>
              <!-- Top Metadata -->
              <div class="flex items-center justify-between text-xs mb-2">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="text-[11px] font-bold text-slate-400">#${d.no}</span>
                  ${getPersonaBadge(d.persona)}
                  <span class="px-2 py-0.5 rounded text-[10px] font-medium bg-slate-100 text-slate-700">${d.category}</span>
                </div>
                <span class="text-[11px] text-slate-400 flex items-center gap-1">
                  <i class="fa-solid fa-magnifying-glass text-[9px]"></i> ${d.query}
                </span>
              </div>

              <!-- Title -->
              <h3 class="text-sm font-bold text-slate-900 mb-2 leading-snug hover:text-blue-600 transition-colors">
                <a href="${d.url}" target="_blank">${d.title}</a>
              </h3>

              <!-- Author Body Snippet -->
              <div class="text-xs text-slate-600 mb-3 bg-slate-50 p-2.5 rounded-lg border border-slate-100 line-clamp-3">
                <span class="font-semibold text-slate-700 mr-1"><i class="fa-regular fa-user text-[11px]"></i> 본문:</span>
                ${d.snippet || '본문 내용 생략 (클릭 시 원문 확인)'}
              </div>

              <!-- Verified Neighbor Comment -->
              ${hasRealReply ? `
                <div class="text-xs text-emerald-900 bg-emerald-50/70 p-2.5 rounded-lg border border-emerald-200 mb-3">
                  <div class="flex items-center gap-1.5 font-bold text-emerald-800 text-[11px] mb-1">
                    <i class="fa-regular fa-comment-dots"></i> 실제 이웃 거주자 댓글:
                  </div>
                  <p class="text-[11.5px] leading-relaxed line-clamp-2">${d.reply_preview}</p>
                </div>
              ` : `
                <div class="text-[11px] text-slate-400 bg-slate-50 px-2.5 py-1.5 rounded border border-slate-100 mb-3 flex items-center gap-1.5">
                  <i class="fa-solid fa-check text-emerald-500"></i> 실제 커뮤니티 댓글 소통 확인 완료
                </div>
              `}
            </div>

            <!-- Bottom Action -->
            <div class="pt-2 border-t border-slate-100 flex items-center justify-between mt-auto">
              <span class="text-[11px] font-medium text-slate-400 flex items-center gap-1">
                <i class="fa-solid fa-coffee text-slate-400"></i> ${d.source}
              </span>
              <a href="${d.url}" target="_blank" class="inline-flex items-center gap-1 text-xs font-semibold text-blue-600 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 px-2.5 py-1 rounded-md transition-colors">
                원문 바로가기 <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    renderCards();
  </script>
